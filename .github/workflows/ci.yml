name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -count=1

      - name: Vet
        run: go vet ./...

  generate-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build compschema
        run: go build -o compschema ./cmd/compschema/

      - name: Extract JSON Schema from OpenAI spec
        run: ./compschema extract --spec testdata/openai/openapi.yaml --path /responses --validate --out /tmp/responses.schema.json

      - name: Import into Go structs
        run: |
          mkdir -p /tmp/roundtrip
          ./compschema import --package roundtrip --out /tmp/roundtrip/types.go /tmp/responses.schema.json

      - name: Generate from Go structs
        run: ./compschema generate --all --out /tmp/roundtrip /tmp/roundtrip

      - name: Diff (IR-level)
        run: |
          OUTPUT=$(./compschema diff --ir /tmp/responses.schema.json /tmp/roundtrip/schema.gen.json)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "100.0%"
